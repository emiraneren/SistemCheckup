<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Checkup</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #f8f9fb; --line: #e3e6eb;
  --text: #16181d; --muted: #646b78; --accent: #3a5bd9;
  --ok: #1f8a4c; --ok-bg: #e6f4ec; --warn: #a86400; --warn-bg: #fdf1dd;
  --bad: #c62f2f; --bad-bg: #fbe7e7; --info: #2f63b8; --info-bg: #e7eefa;
  --bar: #3a5bd9; --bar-bg: #e8ebf2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --panel: #171a21; --panel2: #1c2029; --line: #2a2f3a;
    --text: #e8eaef; --muted: #9098a7; --accent: #7d97ff;
    --ok: #4cc584; --ok-bg: #15291f; --warn: #f0b04a; --warn-bg: #2d2414; --bad: #ff6b6b; --bad-bg: #321a1c;
    --info: #78a6ff; --info-bg: #17223a; --bar: #7d97ff; --bar-bg: #262b37;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --panel: #171a21; --panel2: #1c2029; --line: #2a2f3a;
  --text: #e8eaef; --muted: #9098a7; --accent: #7d97ff;
  --ok: #4cc584; --ok-bg: #15291f; --warn: #f0b04a; --warn-bg: #2d2414; --bad: #ff6b6b; --bad-bg: #321a1c;
  --info: #78a6ff; --info-bg: #17223a; --bar: #7d97ff; --bar-bg: #262b37;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; }
nav { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
nav .wrap { display: flex; gap: 4px; padding-top: 10px; padding-bottom: 10px; overflow-x: auto; align-items: center; scrollbar-width: none; }
nav .wrap::-webkit-scrollbar { display: none; }
nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; white-space: nowrap; font-weight: 500; }
nav a:hover { background: var(--panel); color: var(--text); }
nav .sp { flex: 1; }
nav button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; white-space: nowrap; }
header.hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; padding: 32px 0 20px; }
.scorecard { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.scorecard .chips { margin-top: 8px; }
.clist { margin: 0; padding-left: 18px; } .clist li { margin: 2px 0; }
.ring { position: relative; width: 108px; height: 108px; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .val b { font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; display: block; }
.ring .val span { font-size: 12px; color: var(--muted); display: block; }
h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.01em; }
.sub { color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }
.chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.info { background: var(--info-bg); color: var(--info); }
.chip.muted { background: var(--panel); color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
section { margin-top: 32px; }
h2 { font-size: 18px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
h2 small { font-size: 13px; color: var(--muted); font-weight: 400; }
h3 { font-size: 15px; margin: 0 0 10px; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.finding { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 14px 16px; border-left: 4px solid transparent; }
.finding.bad { border-left-color: var(--bad); } .finding.warn { border-left-color: var(--warn); }
.finding.info { border-left-color: var(--info); } .finding.ok { border-left-color: var(--ok); }
.finding .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.ic.bad { background: var(--bad-bg); color: var(--bad); } .ic.warn { background: var(--warn-bg); color: var(--warn); }
.ic.info { background: var(--info-bg); color: var(--info); } .ic.ok { background: var(--ok-bg); color: var(--ok); }
.finding .t { font-weight: 600; } .finding .d { color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; white-space: pre-line; }
.finding .t .pill { margin-left: 8px; vertical-align: 1px; }
.nasil h3 { margin: 18px 0 6px; } .nasil h3:first-child { margin-top: 0; } .nasil p, .nasil li { color: var(--muted); } .nasil ul { margin: 4px 0; padding-left: 20px; }
.devlist { margin: 0; padding: 0; list-style: none; } .devlist li { padding: 3px 0; overflow-wrap: anywhere; }
.finding .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.btn { display: inline-block; text-decoration: none; background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; white-space: nowrap; }
:root[data-theme="dark"] .btn { color: #0f1115; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: #0f1115; } }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.okfold summary { cursor: pointer; color: var(--muted); padding: 8px 2px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.big { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
.big small { font-size: 13px; font-weight: 500; color: var(--muted); }
.label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.stat .label { margin-bottom: 4px; }
.hw-title { font-weight: 600; font-size: 15px; margin: 2px 0 2px; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 4px; background: var(--bar-bg); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--bar); border-radius: 4px; }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.brow { display: grid; grid-template-columns: 150px 1fr 110px; gap: 12px; align-items: center; padding: 6px 0; }
.brow .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.brow .v small { color: var(--muted); font-weight: 400; display: block; font-size: 11px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl { overflow-x: auto; padding: 4px 6px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.info { background: var(--info-bg); color: var(--info); }
.muted { color: var(--muted); }
.note { background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; color: var(--muted); }
.spark { width: 100%; height: 70px; display: block; }
.diskhead { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 12px; }
.nvbox { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.nvbox .arrow { font-size: 22px; color: var(--muted); }
footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
code { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font-size: 12.5px; }
@media (max-width: 860px) { .g3, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) {
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  header.hero { grid-template-columns: 1fr; justify-items: start; }
  .brow { grid-template-columns: 1fr 90px; } .brow .bar { grid-column: 1 / -1; grid-row: 2; }
  .finding { grid-template-columns: 28px 1fr; } .finding .a { grid-column: 2; }
}
@media print { nav { display: none; } body { background: #fff; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<nav><div class="wrap">
  <a href="#ozet">Özet</a><a href="#donanim">Donanım</a><a href="#islemci">İşlemci</a><a href="#ekran">Ekran Kartı</a>
  <a href="#bellek">Bellek</a><a href="#depolama">Depolama</a><a href="#suruculer">Sürücüler</a><a href="#cihazlar">Cihazlar</a><a href="#kararlilik">Kararlılık</a><a href="#pil">Pil</a><a href="#nasil">Nasıl çalışıyor?</a>
  <span class="sp"></span><button id="tema" type="button">Tema</button><button type="button" onclick="window.print()">Yazdır / PDF</button>
</div></nav>
<div class="wrap" id="app"></div>

<script>
const D = /*__VERI__*/null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d });
const arr = x => x == null ? [] : Array.isArray(x) ? x : [x];
const ICON = { bad: '!', warn: '!', info: 'i', ok: '✓' };
const SEV = { bad: 'Sorun', warn: 'Uyarı', info: 'Bilgi', ok: 'İyi' };
function link(u, text, cls = 'btn') {
  if (!u) return '';
  const ext = /^https?:/.test(u);
  return `<a class="${cls}" href="${esc(u)}"${ext ? ' target="_blank" rel="noopener"' : ''}>${esc(text || 'Aç')}</a>`;
}
function kv(rows) {
  return '<dl class="kv">' + rows.filter(r => r[1] != null && r[1] !== '').map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join('') + '</dl>';
}
function stat(label, value, unit = '', extra = '') {
  return `<div class="card stat"><div class="label">${esc(label)}</div><div class="big">${value}${unit ? ` <small>${esc(unit)}</small>` : ''}</div>${extra ? `<div class="muted" style="margin-top:4px">${extra}</div>` : ''}</div>`;
}
function bar(pct, cls = '') { return `<div class="bar ${cls}"><i style="width:${Math.max(1, Math.min(100, pct || 0))}%"></i></div>`; }

function render() {
  if (!D) { document.getElementById('app').innerHTML = '<p style="padding:40px 0">Rapor verisi bulunamadı. Bu dosya bir şablondur; <code>SistemCheckup.exe</code> çalıştırın.</p>'; return; }
  const B = arr(D.bulgular);
  const n = s => B.filter(b => b.seviye === s).length;
  const P = typeof D.puan === 'object' && D.puan ? D.puan : { donanim: D.puan, bakim: null };
  const C = 2 * Math.PI * 46;
  const S = D.sistem, cpu = D.cpu, ram = D.ram;
  const gpus = arr(D.gpu).filter(g => !g.sanal);
  const nT = (tur, s) => B.filter(b => b.tur === tur && b.seviye === s).length;
  let h = '';

  const verdict = P.donanim >= 85 ? (P.bakim != null && P.bakim < 75 ? 'Donanımınız sağlıklı, birkaç bakım işi var' : 'Bilgisayarınız sağlıklı görünüyor')
    : P.donanim >= 60 ? 'Donanımda dikkat edilmesi gereken noktalar var' : 'Donanımda ciddi sorun belirtileri var';
  const ring = (val, label, desc, tur) => {
    const col = val >= 85 ? 'var(--ok)' : val >= 60 ? 'var(--warn)' : 'var(--bad)';
    const word = val >= 90 ? 'Çok iyi' : val >= 75 ? 'İyi' : val >= 50 ? 'Dikkat' : 'Sorunlu';
    const sorun = nT(tur, 'bad'), uyari = nT(tur, 'warn');
    return `<div class="card scorecard"><div class="ring"><svg width="108" height="108"><circle cx="54" cy="54" r="46" fill="none" stroke="var(--bar-bg)" stroke-width="10"/>
      <circle cx="54" cy="54" r="46" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C * val / 100} ${C}"/></svg>
      <div class="val"><div><b>${val}</b><span>${word}</span></div></div></div>
      <div><div class="hw-title">${esc(label)}</div><div class="muted">${desc}</div>
      <div class="chips">${sorun ? `<span class="chip bad">${sorun} sorun</span>` : ''}${uyari ? `<span class="chip warn">${uyari} uyarı</span>` : ''}${!sorun && !uyari ? '<span class="chip ok">sorun yok</span>' : ''}</div></div></div>`;
  };

  // ---------- hero
  h += `<header id="ozet" style="padding:28px 0 8px"><h1>${esc(verdict)}</h1>
      <div class="sub">${esc(S.bilgisayar)} · ${esc(S.isletimSistemi)} ${esc(S.surum)} · ${esc(D.meta.tarih)} · ${D.meta.testYapildi ? 'tam tarama' : 'hızlı tarama'} (${D.meta.sureSn} sn) · ${D.meta.yonetici ? 'yönetici izniyle' : 'yönetici izni olmadan'}</div></header>
    <div class="grid g2" style="margin-top:16px">
      ${ring(P.donanim, 'Donanım sağlığı', 'Parçaların fiziksel durumu: disk ve SSD sağlığı, sıcaklıklar, donanım hata kayıtları' + (S.dizustu ? ', pil' : '') + '. Düşükse bir parça arızalanıyor olabilir.', 'donanim')}
      ${P.bakim != null ? ring(P.bakim, 'Bakım ve güncellemeler', 'Sürücüler, Windows güncellemeleri, disk alanı ve ayarlar. Düşük olması donanımın bozuk olduğu anlamına <b>gelmez</b>; birkaç tıkla düzeltilebilecek işlerdir.', 'bakim') : ''}
    </div>`;

  // ---------- comparison
  const K = D.karsilastirma;
  if (K) {
    const dl = (a, b) => b == null || a == null ? '' : b > a ? `<b style="color:var(--ok)">↑ ${b - a}</b>` : b < a ? `<b style="color:var(--bad)">↓ ${a - b}</b>` : '<span class="muted">değişmedi</span>';
    const yon = { iyi: 'var(--ok)', kotu: 'var(--bad)', ayni: 'var(--muted)' };
    const degis = arr(K.degisimler).map(d => `<li><span>${esc(d.ad)}</span> <span class="muted">${fmt(d.once, d.once < 100 ? 1 : 0)} → </span><b style="color:${yon[d.yon]}">${fmt(d.simdi, d.simdi < 100 ? 1 : 0)} ${esc(d.birim)}</b>${d.farkYuzde != null ? ` <span class="muted">(${d.farkYuzde > 0 ? '+' : ''}${fmt(d.farkYuzde, 1)}%)</span>` : ''}</li>`).join('');
    h += `<section><h2>Önceki taramaya göre <small>${esc(K.tarih)}</small></h2><div class="card"><div class="grid g2">
      <div>${kv([['Donanım sağlığı', `${K.donanimOnce} → ${P.donanim} ${dl(K.donanimOnce, P.donanim)}`], ['Bakım', `${K.bakimOnce ?? '—'} → ${P.bakim ?? '—'} ${dl(K.bakimOnce, P.bakim)}`]])}
        ${arr(K.cozulen).length ? `<p style="margin:12px 0 4px"><b style="color:var(--ok)">✓ Çözülen ${arr(K.cozulen).length} konu:</b></p><ul class="clist">${arr(K.cozulen).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${arr(K.yeni).length ? `<p style="margin:12px 0 4px"><b style="color:var(--warn)">Yeni ${arr(K.yeni).length} konu:</b></p><ul class="clist">${arr(K.yeni).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${!arr(K.cozulen).length && !arr(K.yeni).length ? '<p class="muted">Sorun listesinde değişiklik yok.</p>' : ''}</div>
      <div>${degis ? `<div class="label" style="margin-bottom:6px">Ölçüm değişimleri</div><ul class="clist">${degis}</ul>` : `<p class="muted">${D.meta.testYapildi && K.tamTarama ? 'Ölçümlerde kayda değer değişim yok.' : 'Hız ölçümlerini karşılaştırmak için iki taramanın da "Tam tarama" olması gerekir.'}</p>`}</div>
    </div></div></section>`;
  }

  // ---------- findings
  const act = B.filter(b => b.seviye !== 'ok');
  const fin = b => `<div class="card finding ${b.seviye}"><div class="ic ${b.seviye}">${ICON[b.seviye]}</div>
      <div><div class="k">${esc(b.kategori)} · ${b.tur === 'bakim' ? 'Bakım' : 'Donanım'} · ${SEV[b.seviye]}</div><div class="t">${esc(b.baslik)}${b.rozet ? `<span class="pill ${/Büyük/.test(b.rozet) ? 'warn' : 'info'}">${esc(b.rozet)}</span>` : ''}</div>${b.detay ? `<div class="d">${esc(b.detay)}</div>` : ''}</div>
      <div class="a">${link(b.link, b.linkMetin, b.seviye === 'ok' || b.seviye === 'info' ? 'btn ghost' : 'btn')}</div></div>`;
  h += `<section><h2>Yapılması gerekenler <small>${act.length ? 'önem sırasına göre · "Bilgi" olanlar sorun değildir' : 'her şey yolunda'}</small></h2><div class="stack">${act.map(fin).join('') || '<div class="note">Herhangi bir sorun veya uyarı bulunmadı.</div>'}</div>
    <details class="okfold"><summary>Sağlıklı bulunan ${n('ok')} kontrol</summary><div class="stack">${B.filter(b => b.seviye === 'ok').map(fin).join('')}</div></details></section>`;

  // ---------- battery
  if (D.pil) {
    const pl = arr(D.pil.piller);
    h += `<section id="pil"><h2>Pil <small>şarj %${fmt(D.pil.sarjYuzde)} · ${D.pil.prizde ? 'prize takılı' : 'pille çalışıyor'}</small></h2><div class="grid g2">${pl.map(p => `<div class="card">
      <div class="hw-title">${esc(p.ad || 'Pil')}</div>
      <div class="brow"><div>Kalan kapasite</div>${bar(p.saglikYuzde, p.saglikYuzde < 60 ? 'bad' : p.saglikYuzde < 80 ? 'warn' : '')}<div class="v">%${fmt(p.saglikYuzde)}</div></div>
      ${kv([['Şu an tutabildiği', fmt(p.doluMWh / 1000, 1) + ' Wh'], ['Yeniyken', fmt(p.tasarimMWh / 1000, 1) + ' Wh'], ['Şarj döngüsü', p.dongu != null ? fmt(p.dongu) : 'bildirilmiyor'], ['Tür', esc(p.kimya)]])}
      <p class="muted" style="font-size:12px;margin:8px 0 0">Piller kullanıldıkça kapasite kaybeder; %80'in üstü iyi, %60'ın altı değişim zamanı demektir.</p></div>`).join('') || '<div class="note">Pil bilgisi okunamadı.</div>'}</div></section>`;
  }

  // ---------- hardware overview
  const g0 = gpus[0];
  const dsum = arr(D.diskler).map(d => `${d.ad} (${fmt(d.boyutGB)} GB)`).join('<br>');
  h += `<section id="donanim"><h2>Donanım özeti</h2><div class="grid g4">
    <div class="card"><div class="label">İşlemci</div><div class="hw-title">${esc(cpu.ad)}</div><div class="muted">${cpu.cekirdek} çekirdek / ${cpu.izlek} izlek</div></div>
    <div class="card"><div class="label">Ekran kartı</div><div class="hw-title">${esc(g0 ? g0.ad : '—')}</div><div class="muted">${g0 && g0.vramGB ? fmt(g0.vramGB, 0) + ' GB VRAM' : ''}</div></div>
    <div class="card"><div class="label">Bellek</div><div class="hw-title">${fmt(ram.toplamGB)} GB ${esc(arr(ram.moduller)[0]?.tip || '')}</div><div class="muted">${arr(ram.moduller)[0]?.ayarliMHz || '—'} MHz · ${esc(ram.kanal)}</div></div>
    <div class="card"><div class="label">Anakart</div><div class="hw-title">${esc(S.anakartModel)}</div><div class="muted">${esc(S.anakartUretici)}</div></div>
  </div>
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3>Sistem</h3>${kv([
      ['İşletim sistemi', esc(`${S.isletimSistemi} ${S.surum}`)], ['Derleme', esc(S.derleme)], ['Çalışma süresi', esc(S.calismaSuresi)],
      ['Son Windows güncellemesi', esc(S.sonWinGuncelleme)], ['Antivirüs', S.antivirus ? (S.antivirus.gercekZamanli ? 'Defender açık' : 'Gerçek zamanlı koruma kapalı') + ` · tanımlar ${esc(S.antivirus.imzaTarihi)}` : null],
      ['Sistem', esc(`${S.sistemUretici} ${S.sistemModel}`)],
    ])}</div>
    <div class="card"><h3>Anakart ve depolama</h3>${kv([

    ${ev('Düzeltilmiş donanım uyarısı', O.duzeltilenDonanim, 'info', 'kayıt yok')}
    ${ev('Uygulama çökmesi', O.uygulamaCokmesi, 'info', 'kayıt yok')}
    <div class="card"><div class="label">En çok çöken uygulamalar</div>${arr(O.enCokCoken).map(a => `<div style="display:flex;justify-content:space-between;gap:8px"><span style="overflow-wrap:anywhere">${esc(a.uygulama)}</span><b>${a.adet}</b></div>`).join('') || '<div class="muted">yok</div>'}</div>
  </div></section>`;

  h += `<section id="nasil"><h2>Nasıl çalışıyor?</h2><div class="card nasil">
    <h3>Bu bir check-up, stres testi değil</h3>
    <p>Sistem Checkup, doktordaki genel kontrol gibi çalışır: parçaların ve Windows'un zaten tuttuğu kayıtları okur, yanında birkaç kısa ölçüm yapar. Üç kaynağa bakar:</p>
    <ul>
      <li><b>Parçaların kendi raporları:</b> SSD ve diskler kendi sağlık durumlarını sürekli ölçer (SMART): kalan ömür, sıcaklık, çalışma saati, hata sayısı. NVIDIA ekran kartı sıcaklığını, gücünü ve bağlantı hızını bildirir. Pil, yeniyken ve şimdi ne kadar enerji tuttuğunu bildirir.</li>
      <li><b>Windows'un hata kayıtları (son 30 gün):</b> mavi ekranlar, düzgün kapatılmadan kapanmalar, işlemci / bellek / PCIe'nin kendi bildirdiği donanım hataları (WHEA), disk hataları ve ekran sürücüsü çökmeleri. Aygıt Yöneticisi'nde sürücüsü olmayan ya da hata veren aygıtlar.</li>
      <li><b>Kısa ölçümler (yalnızca tam taramada):</b> diske 1 GB geçici dosya Windows önbelleği atlanarak yazılıp okunur. İşlemci önce tek çekirdekte 3 saniye, sonra tüm çekirdeklerde 10 saniye hesap yapar; bu sırada hızı (MHz) her saniye ölçülür, hız düşerse işlemci ısınıp kendini yavaşlatıyor demektir. Bellek hızı 256 MB veri kopyalanarak ölçülür.</li>
    </ul>
    <h3>Puanlar nasıl hesaplanıyor?</h3>
    <p>İki puan da 100'den başlar. <b>Donanım sağlığı:</b> her sorun −20, her uyarı −7. <b>Bakım:</b> her sorun −15, her uyarı −6. "Bilgi" maddeleri ve küçük güncellemeler puanı düşürmez. 90 ve üstü çok iyi, 75 ve üstü iyi, 50 ve üstü dikkat, altı sorunlu. İşlemci ve disk puanları bu programa özeldir; kendi bilgisayarınızın zaman içindeki değişimini izlemek içindir.</p>
    <h3>Sürücüler nasıl kontrol ediliyor?</h3>
    <p>NVIDIA sürücüsü NVIDIA'nın sunucusundaki son sürümle karşılaştırılır. Diğer sürücüler için Microsoft'un Windows Update kataloğuna bakılır; AMD / Intel ekran kartı ve BIOS için sürücünün yaşına bakılıp üreticinin sayfasına yönlendirilir.</p>
    <p><b>Küçük güncelleme:</b> aynı sürücü serisinin hata düzeltmeli sürümü; acil değildir. <b>Büyük güncelleme:</b> Windows'un genel sürücüsünden üreticinin kendi sürücüsüne geçiş, yeni bir ana sürüm ya da 2 yıldan eski bir sürücünün yenilenmesi; kurulması önerilir.</p>
    <h3>Neleri ölçemez?</h3>
    <ul>
      <li>Belleği hata için test etmez (bunun için MemTest86 gerekir, saatler sürer).</li>
      <li>Ekran kartını oyun yükü altında, işlemciyi uzun süre test etmez (FurMark, 3DMark, OCCT, Prime95).</li>
      <li>İşlemci çekirdek sıcaklığı ve fan hızları Windows tarafından verilmez (HWiNFO ile görülebilir). Güç kaynağı hiç ölçülemez.</li>
    </ul>
    <p>Tarama tamamen bilgisayarınızda yapılır; raporlar hiçbir yere gönderilmez.</p>
  </div></section>`;

  h += `<footer>Sistem Checkup ${esc(D.meta.surum)} · Yeni tarama için <code>SistemCheckup.exe</code>'yi açın. Raporlar <code>Raporlar</code> klasörüne kaydedilir.
    ${D.meta.yonetici ? '' : '<br>Not: Yönetici izni verilmediği için SSD ömür/sıcaklık bilgileri eksik.'}
    <br>Windows Ayarları'nı açan butonlarda (ör. "İsteğe bağlı güncellemeleri aç") tarayıcınız "Ayarlar açılsın mı?" diye sorabilir; "Aç" demeniz yeterlidir. Aynı butonlar Sistem Checkup penceresinde doğrudan çalışır.
    <br>İşlemci çekirdek sıcaklığını Windows doğrudan vermez; ayrıntılı sensör takibi için HWiNFO kullanabilirsiniz.</footer>`;
  if (!D.pil) document.querySelector('nav a[href="#pil"]')?.remove();

  document.getElementById('app').innerHTML = h;
}

const temaBtn = document.getElementById('tema');
function temaUygula(t) { if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
try { temaUygula(localStorage.getItem('sc-tema')); } catch (e) {}
temaBtn.addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  const t = dark ? 'light' : 'dark';
  temaUygula(t);
  try { localStorage.setItem('sc-tema', t); } catch (e) {}
});
render();
</script>
</body>
</html>
